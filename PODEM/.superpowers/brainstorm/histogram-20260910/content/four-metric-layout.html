<style>
  .dashboard { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px; }
  .metric { border:1px solid #dbe3ef; border-radius:12px; padding:14px; background:#fff; }
  .metric h3 { margin:0 0 3px; font-size:16px; }
  .unit { font-size:12px; color:#64748b; margin-bottom:8px; }
  .plot { height:155px; display:flex; align-items:end; gap:13px; padding:12px 10px 0; border-left:1px solid #94a3b8; border-bottom:1px solid #94a3b8; background:repeating-linear-gradient(to top,#fff 0,#fff 38px,#e8edf4 39px); }
  .circuit { flex:1; height:100%; display:flex; align-items:end; justify-content:center; gap:3px; position:relative; }
  .circuit::after { content:attr(data-name); position:absolute; bottom:-20px; font-size:10px; color:#64748b; }
  .bar { width:24%; min-width:6px; border-radius:3px 3px 0 0; }
  .h { background:#64748b; } .m { background:#f59e0b; } .g { background:#2563eb; }
  .legend { display:flex; justify-content:center; gap:18px; margin-top:28px; font-size:12px; color:#475569; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; }
  @media (max-width:850px) { .dashboard { grid-template-columns:1fr; } }
</style>

<h2>四个指标，分别按电路比较</h2>
